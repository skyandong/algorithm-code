ode && go build ./notes/mysql/...)", "Bash(cd /d/code/andong/golang/algorithm-code && go build ./notes/mysql/ent/cmd/)", "Bash(cd /d/code/andong/golang/algorithm-code && go generate ./notes/mysql/ent/ && grep \"ID \" notes/mysql/ent/user.go | head -5)", "Bash(cd /d/code/andong/golang/algorithm-code && mkdir -p webapp/cmd/server webapp/internal/handler webapp/internal/service webapp/internal/repository webapp/internal/data/schema)", "Bash(cd /d/code/andong/golang/algorithm-code/webapp && go mod tidy && go generate ./internal/data/)", "Bash(cd /d/code/andong/golang/algorithm-code/webapp && mv internal/repository internal/_repository && mv internal/handler internal/_handler && mv internal/service internal/_service && go mod tidy && go generate ./internal/data/)", "Bash(cd /d/code/andong/golang/algorithm-code/webapp && mv cmd/server cmd/_server && go mod tidy && go generate ./internal/data/)", "Bash(cd /d/code/andong/golang/algorithm-code/webapp && go generate ./internal/data/)", "Bash(cd /d/code/andong/golang/algorithm-code/webapp && mv cmd/_server cmd/server && mv internal/_repository internal/repository && mv internal/_handler internal/handler && mv internal/_service internal/service && go mod tidy && go build ./...)", "Bash(cd /d/code/andong/golang/algorithm-code/webapp && go mod tidy && go build ./...)", "Bash(cd /d/code/andong/golang/algorithm-code/webapp && rm -f internal/repository/ent_ext.go && go vet ./...)", "Bash(cd /d/code/andong/golang/algorithm-code/webapp && go build ./...)", "Bash(cd /d/code/andong/golang/algorithm-code && mkdir -p http3)", "Bash(cd /d/code/andong/golang/algorithm-code/http3 && go get github.com/quic-go/quic-go@latest)", "Bash(ls \"$(go env GOPATH)\"/pkg/mod/github.com/quic-go/quic-go@v0.61.0/http3/ 2>/dev/null || echo \"http3 dir not found in quic-go\")", "Bash(cd /d/code/andong/golang/algorithm-code/http3 && go mod tidy && go build ./...)", "Bash(grep -n \"func \" \"$(go env GOPATH)\"/pkg/mod/github.com/quic-go/quic-go@v0.61.0/http3/server.go | head -20)", "Bash(grep -n \"func \" \"$(go env GOPATH)\"/pkg/mod/github.com/quic-go/quic-go@v0.61.0/http3/transport.go | head -20)", "Bash(cd /d/code/andong/golang/algorithm-code/http3 && rm server.go client.go && mkdir -p cmd/server cmd/client)", "Bash(cd /d/code/andong/golang/algorithm-code && git add .gitignore .gitattributes go.mod go.sum notes/mysql/ webapp/ http3/ reasonix.toml && git status)"]
# ask = ["Edit(src/**)"]   # force a prompt even if otherwise allowed

[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) and allow_write extras.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

