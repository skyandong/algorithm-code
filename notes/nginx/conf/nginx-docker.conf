# nginx 主实验配置（Docker 版）
# 跑法（镜像拉不下来就先手动: docker pull nginx:1.27-alpine）：
#   cd conf && ./gen-certs.sh && mkdir -p logs run
#   docker run --rm --name nginx-lab \
#     -p 8080:8080 -p 8083:8083 -p 8443:8443 \
#     -v "$(pwd)/nginx-docker.conf":/etc/nginx/nginx.conf:ro \
#     -v "$(pwd)/certs":/etc/nginx/certs:ro \
#     -v "$(pwd)/logs":/var/log/nginx \
#     nginx:1.27-alpine
#
# 关键区别：容器内 127.0.0.1 是容器自己，必须用 host.docker.internal 访问宿主机上的后端。

worker_processes 2;
error_log /var/log/nginx/error.log info;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;

    sendfile on;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 100;
    gzip_proxied any;

    limit_req_zone  $binary_remote_addr zone=req_limit:10m  rate=5r/s;
    limit_req_status 429;

    upstream backend {
        server host.docker.internal:8081;
        server host.docker.internal:8082;
        keepalive 32;
    }

    server {
        listen 8080;

        location = /exact      { return 200 "match:exact\n"; }
        location ^~ /images/   { return 200 "match:prefix-caret\n"; }
        location ~ \.php$      { return 200 "match:regex\n"; }
        location /images       { return 200 "match:prefix\n"; }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 8083;
        location / {
            limit_req zone=req_limit burst=10 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    server {
        listen 8443 ssl;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
