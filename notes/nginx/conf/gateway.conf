# ============================================================
# 第七节：用 nginx 手搓一个最小 API 网关
# ============================================================
# 覆盖网关四件套：统一鉴权(auth_request) + 限流 + 灰度分流 + 反代透传
#
# 本机跑法（需 brew install nginx）：
#   cd conf && mkdir -p logs run
#   cd ../experiments && go run . 7        # 起 v1/v2 后端 + 鉴权服务
#   cd ../conf && nginx -c "$(pwd)/gateway.conf"
#   停止：nginx -c "$(pwd)/gateway.conf" -s stop
#
# Docker 跑法（不用装 nginx）：
#   docker run --rm --name gw-lab -p 8090:8090 \
#     -v "$(pwd)/gateway-docker.conf":/etc/nginx/nginx.conf:ro \
#     -v "$(pwd)/logs":/var/log/nginx \
#     nginx:1.27-alpine
#
# 端口规划：
#   8090  网关入口（客户端唯一该知道的地址）
#   8071  v1 后端    8072  v2 后端（灰度目标）
#   9090  鉴权服务（auth_request 子请求打这里）
#
# ⚠️ 和 01-06 节的 8081/8082 后端刻意分开：网关实验需要后端回显网关透传的头，
#    改现有后端会破坏前面实验的断言。
# ============================================================

worker_processes 1;
error_log logs/error.log info;
pid run/nginx-gw.pid;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;

    # ===== 灰度分流：按请求头决定走哪个上游 =====
    # 这就是"网关做路由决策"的最小形态。
    # 生产上更常见的是按百分比切流（split_clients，见文件末尾注释），
    # 这里用 header 是因为 curl 能精确控制，便于验证。
    map $http_x_canary $gw_backend {
        default   backend_v1;
        "1"       backend_v2;
    }

    upstream backend_v1 {
        server 127.0.0.1:8071;
        keepalive 16;
    }
    upstream backend_v2 {
        server 127.0.0.1:8072;
        keepalive 16;
    }
    upstream auth_svc {
        server 127.0.0.1:9090;
        keepalive 16;
    }

    # 网关专用限流区（和 03 节的 req_limit 分开，互不干扰）
    limit_req_zone $binary_remote_addr zone=gw_limit:10m rate=3r/s;

    server {
        listen 8090;
        server_name gateway.local;

        # ----------------------------------------------------------
        # 鉴权子请求端点
        # internal 是关键：外部直接访问 /_gw_auth 会拿到 404，
        # 只有 nginx 内部的 auth_request 能打到它。
        # 少了这一行，任何人都能绕过网关直接问鉴权服务"我合不合法"。
        # ----------------------------------------------------------
        location = /_gw_auth {
            internal;
            proxy_pass http://auth_svc/auth;
            proxy_pass_request_body off;              # 鉴权只看头，body 没必要带
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI    $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ----------------------------------------------------------
        # 业务路由：鉴权 → 限流 → 灰度 → 反代
        # 顺序有讲究：先鉴权再限流，未登录的连限流配额都不该消耗。
        # ----------------------------------------------------------
        location /api/ {
            # 1) 统一鉴权
            auth_request /_gw_auth;
            # 把鉴权服务放在响应头里的用户信息抓成变量，再透传给后端。
            # 这是 auth_request 最值钱的用法：网关验一次签，后端不用再验。
            auth_request_set $gw_user $upstream_http_x_user_id;
            auth_request_set $gw_tier $upstream_http_x_user_tier;
            error_page 401 = @gw_unauthorized;

            # 2) 限流（漏桶）
            limit_req zone=gw_limit burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @gw_toomany;

            # 3) 灰度 + 4) 反代
            # ⚠️ 坑：proxy_pass 里带变量时，nginx 无法复用上游长连接，
            #    upstream 里的 keepalive 会失效，每次请求重新建连。
            #    这是"动态路由"换来的代价，面试常被问到。
            #    要么接受它，要么改用 split_clients / openresty 的 balancer。
            proxy_pass http://$gw_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 网关注入的身份信息 —— 后端直接信，不再验签
            proxy_set_header X-Gateway-User  $gw_user;
            proxy_set_header X-Gateway-Tier  $gw_tier;
            proxy_set_header X-Gateway-Route $gw_backend;   # 便于验证灰度走了哪

            proxy_connect_timeout 3s;
            proxy_read_timeout    10s;
        }

        # 网关自己的错误响应：统一 JSON 形状，不要让后端各说各话
        location @gw_unauthorized {
            default_type application/json;
            return 401 '{"code":401,"msg":"gateway: token missing or invalid"}';
        }
        location @gw_toomany {
            default_type application/json;
            return 429 '{"code":429,"msg":"gateway: rate limit exceeded"}';
        }

        # 健康检查：不鉴权不限流，给负载均衡探活用
        location = /healthz {
            access_log off;
            return 200 "gw ok\n";
        }
    }
}

# ============================================================
# 按百分比灰度（生产更常用，这里没启用，作对比留档）
#
#   split_clients "${remote_addr}${request_uri}" $gw_pct {
#       10%    backend_v2;     # 10% 流量进 v2
#       *      backend_v1;
#   }
#   然后 proxy_pass http://$gw_pct;
#
# 对比：
#   map + header  —— 精确可控，适合内部测试、定向灰度（给特定用户开）
#   split_clients —— 按 hash 稳定分流，同一个用户总落在同一版本，适合放量
#   两者都逃不掉"变量 proxy_pass 丢 keepalive"这个代价
# ============================================================
