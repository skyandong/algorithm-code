# nginx 主实验配置
# 覆盖：01 location 优先级 / 02 反代+负载均衡+keepalive / 03 限流 / 04 TLS 终止 / 05 gzip
#
# 启动（本机 nginx，brew install nginx）：
#   cd conf && ./gen-certs.sh && mkdir -p logs run
#   nginx -c "$(pwd)/nginx.conf"
# 停止：nginx -c "$(pwd)/nginx.conf" -s stop
#
# 注意：upstream 用 127.0.0.1 —— 仅适用于本机直接跑 nginx。
# Docker 跑法见 nginx-docker.conf（容器内 127.0.0.1 是容器自己）。

worker_processes 2;
error_log logs/error.log info;
pid run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;

    # ===== 05 篇：性能 =====
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 100;
    gzip_proxied any;              # 对反代响应也压缩（实验要用）

    # ===== 03 篇：限流 =====
    limit_req_zone  $binary_remote_addr zone=req_limit:10m  rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;

    # ===== 02 篇：上游 =====
    upstream backend {
        server 127.0.0.1:8081;     # 后端-1（experiments/main.go 起）
        server 127.0.0.1:8082;     # 后端-2
        keepalive 32;
    }

    # ===== 01 篇：location 匹配优先级（返回文本，便于断言）=====
    server {
        listen 8080;

        location = /exact {
            return 200 "match:exact\n";
        }
        location ^~ /images/ {
            return 200 "match:prefix-caret\n";
        }
        location ~ \.php$ {
            return 200 "match:regex\n";
        }
        location /images {
            return 200 "match:prefix\n";
        }
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";          # 清 close，启用上游长连接
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;   # ★ TLS 终止后后端感知协议的唯一途径
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }

    # ===== 03 篇：限流（单独前缀，避免干扰其他实验）=====
    server {
        listen 8083;

        location / {
            limit_req zone=req_limit burst=10 nodelay;
            limit_conn conn_limit 20;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }

    # ===== 04 篇：TLS 终止（全模块唯一的 TLS 配置点）=====
    server {
        listen 8443 ssl;
        ssl_certificate     certs/server.crt;    # ./gen-certs.sh 生成
        ssl_certificate_key certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;   # https 进来时后端读到 https
        }
    }
}
