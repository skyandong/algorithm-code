# ============================================================
# 第七节：最小 API 网关（Docker 版）
# ============================================================
# 和 gateway.conf 唯一的区别：容器内 127.0.0.1 是容器自己，
# 访问宿主机上的 Go 后端必须用 host.docker.internal。
#
# 跑法：
#   1) 先在宿主机起后端和鉴权服务
#        cd ../experiments && go run . 7
#   2) 起 nginx 容器
#        cd conf && mkdir -p logs
#        docker run --rm --name gw-lab -p 8090:8090 \
#          -v "$(pwd)/gateway-docker.conf":/etc/nginx/nginx.conf:ro \
#          -v "$(pwd)/logs":/var/log/nginx \
#          nginx:1.27-alpine
#   3) 另开终端验证
#        curl -i http://127.0.0.1:8090/api/hello
#        curl -i -H "Authorization: Bearer alice-token" http://127.0.0.1:8090/api/hello
# ============================================================

worker_processes 1;
error_log /var/log/nginx/error.log info;

events {
    worker_connections 1024;
}

http {
    access_log /var/log/nginx/access.log;

    map $http_x_canary $gw_backend {
        default   backend_v1;
        "1"       backend_v2;
    }

    upstream backend_v1 { server host.docker.internal:8071; keepalive 16; }
    upstream backend_v2 { server host.docker.internal:8072; keepalive 16; }
    upstream auth_svc   { server host.docker.internal:9090; keepalive 16; }

    limit_req_zone $binary_remote_addr zone=gw_limit:10m rate=3r/s;

    server {
        listen 8090;
        server_name gateway.local;

        location = /_gw_auth {
            internal;
            proxy_pass http://auth_svc/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI    $request_uri;
            proxy_set_header X-Original-Method $request_method;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /api/ {
            auth_request /_gw_auth;
            auth_request_set $gw_user $upstream_http_x_user_id;
            auth_request_set $gw_tier $upstream_http_x_user_tier;
            error_page 401 = @gw_unauthorized;

            limit_req zone=gw_limit burst=5 nodelay;
            limit_req_status 429;
            error_page 429 = @gw_toomany;

            proxy_pass http://$gw_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Gateway-User    $gw_user;
            proxy_set_header X-Gateway-Tier    $gw_tier;
            proxy_set_header X-Gateway-Route   $gw_backend;

            proxy_connect_timeout 3s;
            proxy_read_timeout    10s;
        }

        location @gw_unauthorized {
            default_type application/json;
            return 401 '{"code":401,"msg":"gateway: token missing or invalid"}';
        }
        location @gw_toomany {
            default_type application/json;
            return 429 '{"code":429,"msg":"gateway: rate limit exceeded"}';
        }

        location = /healthz {
            access_log off;
            return 200 "gw ok\n";
        }
    }
}
